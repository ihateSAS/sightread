<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#05070b" />
<link rel="icon" type="image/png" href="/icon.png" />
<title>Sightread — Speed Race</title>
<style>
  :root {
    --bg: #05070b;
    --panel: rgba(12, 16, 24, 0.88);
    --glass: rgba(12, 16, 25, 0.56);
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.18);
    --text: #eef1f6;
    --muted: #b3bccb;
    --dim: #7f8999;
    --accent: #047cfc;
    --accent-bright: #5aa9ff;
    --other: #7aa2ff;
    --bad: #ff8f7a;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(90% 60% at 70% 10%, rgba(4, 124, 252, 0.10), transparent 65%), var(--bg);
    color: var(--text);
    min-height: 100vh;
    font: 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .bar-wrap {
    position: sticky; top: 14px; z-index: 20;
    width: calc(100% - 32px); max-width: 1380px; margin: 14px auto 0;
  }
  .bar {
    border-radius: 15px;
    background: var(--glass);
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid var(--line);
    box-shadow: 0 18px 50px -30px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    padding: 9px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); }
  .brand span { font-size: 15.5px; font-weight: 650; letter-spacing: -0.02em; }
  .bar-sub { font: 11px/1 var(--mono); color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg {
    display: inline-flex; padding: 3px; border-radius: 9px;
    background: rgba(5, 7, 11, 0.72); border: 1px solid var(--line);
  }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--dim);
    font: 11px/1 var(--mono); padding: 6px 9px; border-radius: 6px; cursor: pointer;
  }
  .seg button.active { background: rgba(255,255,255,0.1); color: var(--text); }
  input[type=number] { width: 84px; }
  input, textarea {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 9px 11px; font: inherit; outline: none;
  }
  input:focus, textarea:focus { border-color: rgba(4, 124, 252, 0.7); }
  textarea { width: 100%; resize: vertical; font-family: var(--mono); font-size: 13px; line-height: 1.5; }
  button.primary {
    background: var(--accent); color: #05070b; border: 0; border-radius: 9px;
    padding: 9px 18px; font-weight: 650; font-size: 13.5px; cursor: pointer;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); }
  button.primary:disabled { opacity: 0.45; cursor: default; }

  .wrap { max-width: 1380px; margin: 0 auto; padding: 20px 16px 32px; display: flex; flex-direction: column; }
  h1 { font-size: clamp(22px, 3vw, 32px); font-weight: 300; letter-spacing: -0.025em; margin: 0 0 12px; }
  .banner {
    font: 12px/1.45 var(--mono); color: var(--muted); border: 1px solid var(--line);
    background: var(--panel); border-radius: 10px; padding: 10px 13px; margin-bottom: 12px;
  }
  .banner b { color: var(--accent-bright); font-weight: 600; }
  .banner code { font-family: var(--mono); color: #cbd5e1; }
  .presets { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; align-items: center; }
  .chip-btn {
    appearance: none; background: rgba(255,255,255,0.035); border: 1px solid var(--line);
    color: var(--muted); border-radius: 999px; padding: 5px 11px; font: 11px/1.2 var(--mono); cursor: pointer;
  }
  .chip-btn:hover { border-color: rgba(4,124,252,0.5); color: var(--text); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .pane {
    background: var(--panel); border: 1px solid var(--line); border-radius: 13px;
    display: flex; flex-direction: column; overflow: hidden; min-height: 360px; max-height: 540px;
  }
  .pane.c { border-top: 2px solid var(--accent); }
  .pane.o { border-top: 2px solid var(--other); }
  .pane-head {
    display: flex; align-items: baseline; gap: 10px; padding: 13px 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .pane-name { font-weight: 650; font-size: 15px; }
  .pane.c .pane-name { color: var(--accent-bright); }
  .pane.o .pane-name { color: var(--other); }
  .pane-model { font: 11px/1 var(--mono); color: var(--dim); }
  .clock { margin-left: auto; font: 600 22px/1 var(--mono); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 18px; padding: 11px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .stat b { font: 600 16px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
  .pane.c .stat b { color: var(--accent-bright); }
  .stat span { font: 9px/1 var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-top: 3px; }
  .out {
    flex: 1; overflow-y: auto; padding: 14px 16px; font-family: var(--mono);
    font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; color: #cfd4da;
  }
  .stub { color: var(--dim); font-size: 13px; line-height: 1.7; }
  .err { color: var(--bad); font-size: 12px; white-space: pre-wrap; }
  .winner { text-align: center; font: 600 15px/1.4 var(--mono); padding: 16px 0 0; color: var(--accent-bright); }
  .winner.muted { color: var(--dim); }
  @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } .bar-sub { display: none; } }
</style>
</head>
<body>
<div class="bar-wrap">
  <header class="bar">
    <a class="brand" href="/"><img src="/icon.png" alt="" /><span>Sightread</span></a>
    <span class="bar-sub">Cerebras × OpenClaw × Kimi</span>
    <div class="controls">
      <div class="seg" role="group" aria-label="Cerebras reasoning effort">
        <button type="button" class="active" data-effort="low">low</button>
        <button type="button" data-effort="medium">med</button>
        <button type="button" data-effort="high">high</button>
      </div>
      <input id="max" type="number" min="16" max="8000" value="600" title="max tokens" />
      <button id="go" class="primary">Race</button>
    </div>
  </header>
</div>

<div class="wrap">
  <h1>Same model. Same prompt. Two kinds of silicon.</h1>
  <div class="banner" id="banner">checking providers…</div>

  <textarea id="prompt" rows="3" spellcheck="false">Write a Python module that parses a CSV file into typed records, with a validate() function and clear error messages. Output only code.</textarea>
  <div class="presets">
    <button type="button" class="chip-btn" data-preset="Write a Python module that parses a CSV file into typed records, with a validate() function and clear error messages. Output only code.">CSV Parser</button>
    <button type="button" class="chip-btn" data-preset="Write a dependency-free TypeScript LRU cache with TTL expiration and O(1) get/set. Output only code.">LRU Cache (TS)</button>
    <button type="button" class="chip-btn" data-preset="Write the integers from 1 to 1000, each on its own line, with no other text.">1..1000 TPS Test</button>
  </div>

  <div class="grid">
    <section class="pane c">
      <div class="pane-head">
        <span class="pane-name">Cerebras</span>
        <span class="pane-model" id="m-c">—</span>
        <span class="clock" id="t-c">0.00s</span>
      </div>
      <div class="stats">
        <div class="stat"><b id="ttft-c">–</b><span>first token</span></div>
        <div class="stat"><b id="tok-c">–</b><span>tokens</span></div>
        <div class="stat"><b id="tps-c">–</b><span>tok/s</span></div>
      </div>
      <div class="out" id="out-c"><span class="stub">press Race</span></div>
    </section>

    <section class="pane o">
      <div class="pane-head">
        <span class="pane-name">OpenRouter</span>
        <span class="pane-model" id="m-o">—</span>
        <span class="clock" id="t-o">0.00s</span>
      </div>
      <div class="stats">
        <div class="stat"><b id="ttft-o">–</b><span>first token</span></div>
        <div class="stat"><b id="tok-o">–</b><span>tokens</span></div>
        <div class="stat"><b id="tps-o">–</b><span>tok/s</span></div>
      </div>
      <div class="out" id="out-o"><span class="stub">press Race</span></div>
    </section>
  </div>

  <div class="winner" id="winner"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const SIDES = { cerebras: "c", openrouter: "o" };
const state = {};
let raf = null;
let effort = "low";

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

document.querySelectorAll("[data-effort]").forEach((b) => {
  b.addEventListener("click", () => {
    effort = b.dataset.effort;
    document.querySelectorAll("[data-effort]").forEach((x) => x.classList.toggle("active", x === b));
  });
});

document.querySelectorAll("[data-preset]").forEach((b) => {
  b.addEventListener("click", () => { $("prompt").value = b.dataset.preset; });
});

function fmt(ms) { return (ms / 1000).toFixed(2) + "s"; }

function paintClocks() {
  const now = performance.now();
  for (const side of Object.keys(SIDES)) {
    const s = state[side];
    if (!s || !s.running) continue;
    $("t-" + SIDES[side]).textContent = fmt(now - s.t0);
  }
  raf = requestAnimationFrame(paintClocks);
}

function resetPanes() {
  for (const side of Object.keys(SIDES)) {
    const k = SIDES[side];
    $("out-" + k).textContent = "";
    $("t-" + k).textContent = "0.00s";
    $("ttft-" + k).textContent = "–";
    $("tok-" + k).textContent = "–";
    $("tps-" + k).textContent = "–";
    state[side] = { t0: performance.now(), running: true };
  }
  $("winner").textContent = "";
  $("winner").className = "winner";
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(paintClocks);
}

async function loadState() {
  const s = await fetch("/api/state").then((r) => r.json()).catch(() => null);
  if (!s) return;
  $("m-c").textContent = s.cerebras.model;
  $("m-o").textContent = s.openrouter.model;
  const b = $("banner");
  if (s.cerebras.ready && s.openrouter.ready) {
    b.innerHTML = `both providers live — <b>${esc(s.cerebras.model)}</b> vs <b>${esc(s.openrouter.model)}</b>`;
  } else if (s.cerebras.ready && !s.openrouter.ready) {
    b.innerHTML = `Cerebras live · OpenRouter <b>not configured</b> — right pane will show as a stub. Add <code>OPENROUTER_API_KEY</code> to <code>.env</code> to record a real race.`;
  } else {
    b.innerHTML = `waiting on keys — set <code>CEREBRAS_API_KEY</code>${s.openrouter.ready ? "" : " and <code>OPENROUTER_API_KEY</code>"}`;
  }
}

function stub(side, reason) {
  const k = SIDES[side];
  const el = document.createElement("span");
  el.className = "stub";
  el.textContent = `NOT RACING\n${reason}\n\nSet the key then restart node race/server.mjs.`;
  $("out-" + k).innerHTML = "";
  $("out-" + k).appendChild(el);
  state[side].running = false;
}

function handle(ev) {
  const k = SIDES[ev.side];
  if (!k) return;

  if (ev.event === "delta") {
    const el = $("out-" + k);
    el.insertAdjacentText("beforeend", ev.text);
    el.scrollTop = el.scrollHeight;
    return;
  }
  if (ev.event === "skip") { stub(ev.side, ev.reason); return; }
  if (ev.event === "error") {
    const err = document.createElement("span");
    err.className = "err";
    err.textContent = ev.reason;
    $("out-" + k).innerHTML = "";
    $("out-" + k).appendChild(err);
    state[ev.side].running = false;
    return;
  }
  if (ev.event === "done") {
    state[ev.side].running = false;
    state[ev.side].done = ev;
    $("t-" + k).textContent = fmt(ev.totalMs);
    $("ttft-" + k).textContent = ev.firstTokenMs == null ? "–" : fmt(ev.firstTokenMs);
    $("tok-" + k).textContent = ev.exact ? ev.tokens : "≈" + ev.chunks;
    $("tps-" + k).textContent = ev.tps == null ? "–" : ev.tps.toFixed(0);
    judge();
  }
}

function judge() {
  const c = state.cerebras?.done;
  const o = state.openrouter?.done;
  const w = $("winner");
  if (!c || !o) {
    if (c && !state.openrouter?.running && !o) {
      w.className = "winner muted";
      w.textContent = `unopposed — Cerebras answered in ${fmt(c.totalMs)}`;
    }
    return;
  }
  const ratio = (o.totalMs / c.totalMs).toFixed(1);
  w.className = "winner";
  w.textContent = `Cerebras ${fmt(c.totalMs)} · OpenRouter ${fmt(o.totalMs)} · ${ratio}× faster`;
}

$("go").addEventListener("click", async () => {
  $("go").disabled = true;
  resetPanes();

  const res = await fetch("/api/race", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ prompt: $("prompt").value, maxTokens: Number($("max").value), reasoningEffort: effort }),
  });

  if (!res.ok || !res.body) {
    $("banner").textContent = "race failed: " + res.status;
    $("go").disabled = false;
    return;
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      const payload = line.slice(5).trim();
      if (!payload) continue;
      let ev;
      try { ev = JSON.parse(payload); } catch { continue; }
      if (ev.event === "end") { state.cerebras.running = false; state.openrouter.running = false; }
      else handle(ev);
    }
  }

  cancelAnimationFrame(raf);
  judge();
  $("go").disabled = false;
});

loadState();
</script>
</body>
</html>
